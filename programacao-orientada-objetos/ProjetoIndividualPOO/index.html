<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-4bw+/aepP/YC94hEpVNVgiZdgIC5+VKNBQNGCHeKRQN+PtmoHDEXuppvnDJzQIu9" crossorigin="anonymous">
    <link rel="stylesheet" href="style.css">
    <title>CRUD de Jogos</title>
</head>
<body>
    <main class="container mt-4">
        <h1>CRUD de Jogos</h1>
        <button class="btn btn-success mb-2" id="btnAdicionar" data-bs-toggle="modal" data-bs-target="#modalAdicionar">Adicionar Jogo</button>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Nome</th>
                    <th>Preço</th>
                    <th>Data de Lançamento</th>
                    <th>Tipo</th>
                    <th>Ações</th>
                </tr>
            </thead>
            <tbody id="tabelaJogos">
            </tbody>
        </table>
        <div class="modal fade" id="modalAdicionar" tabindex="-1" aria-labelledby="modalAdicionarLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalAdicionarLabel">Adicionar Jogo</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <form id="formAdicionar">
                            <div class="mb-3">
                                <label for="addNome">Nome</label>
                                <input type="text" class="form-control" id="addNome" maxlength="20" required>
                            </div>
                            <div class="mb-3">
                                <label for="addPreco">Preço</label>
                                <input type="number" class="form-control" id="addPreco" min="0" max="9999" required>
                            </div>
    
                            <div class="mb-3">
                                <label for="addDataLancamento">Data de Lançamento</label>
                                <input type="date" class="form-control" id="addDataLancamento" required>
                            </div>
    
                            <div class="mb-3">
                                <label for="addTipo">Tipo</label>
                                <input type="text" class="form-control" id="addTipo" maxlength="20" required>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Fechar</button>
                                <button type="submit" class="btn btn-success" id="btnSalvar">Salvar</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    
    
        <div class="modal fade" id="modalEditar" tabindex="-1" aria-labelledby="modalEditarLabel" aria-hidden="true">
            <div class="modal-dialog">
                <div class="modal-content">
                    <div class="modal-header">
                        <h5 class="modal-title" id="modalEditarLabel">Editar Jogo</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Fechar"></button>
                    </div>
                    <div class="modal-body">
                        <form id="formEditar">
                            <div class="mb-3">
                                <label for="editId">ID</label>
                                <input type="number" class="form-control" id="editId" disabled>
                            </div>
                        
                            <div class="mb-3">
                                <label for="editNome">Nome</label>
                                <input type="text" class="form-control" id="editNome" maxlength="20" required>
                            </div>
                            <div class="mb-3">
                                <label for="editPreco">Preço</label>
                                <input type="number" class="form-control" id="editPreco" min="0" max="9999" required>
                            </div>
                            <div class="mb-3">
                                <label for="editDataLancamento">Data de Lançamento</label>
                                <input type="date" class="form-control" id="editDataLancamento" required>
                            </div>
                            <div class="mb-3">
                                <label for="editTipo">Tipo</label>
                                <input type="text" class="form-control" id="editTipo" maxlength="20" required>
                            </div>
                            <div class="modal-footer">
                                <button type="button" class="btn btn-danger" data-bs-dismiss="modal">Fechar</button>
                                <button type="submit" class="btn btn-success" id="btnAtualizar">Atualizar</button>
                            </div>
                        </form>
                    </div>
                    
                </div>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.1/dist/js/bootstrap.bundle.min.js" integrity="sha384-HwwvtgBNo3bZJJLYd8oVXjrBZt8cqVSpeBNS5n7C8IVInixGAoxmnlMuBnhbgrkm" crossorigin="anonymous"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.4/jquery.min.js"></script>
    <script src="./app.js"></script>
</body>
</html>
