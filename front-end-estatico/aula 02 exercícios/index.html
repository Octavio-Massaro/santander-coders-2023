<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tabela</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@100;300;400;500;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body>
    <!-- Exercício de criação de uma tabela -->
    <table>
        <thead>
            <tr>
                <th class="hide-border"></th>
                <th>Básico</th>
                <th>Padrão</th>
                <th>Avançado</th>
            </tr>
        </thead>

        <tbody>
            
            <tr>
                <td>Preço mensal</td>
                <td class="color-basic highlight">R$ 30</td>
                <td class="color-standard highlight">R$ 40</td>
                <td class="color-advanced highlight">R$ 50</td>
            </tr>

            <tr>
                <td>Número de telas por assinatura</td>
                <td>1</td>
                <td>2</td>
                <td>4</td>
            </tr>

            <tr>
                <td>Resolução de vídeo</td>
                <td>HD</td>
                <td>Full HD</td>
                <td>4K</td>
            </tr>

             <tr>
                <td>Canais extras</td>
                <td>Apenas o canal Minha Natureza</td>
                <td>Minha Natureza e Vida Selvagem</td>
                <td>Todos os canais disponíveis</td>
            </tr>

             <tr>
                <td>Suporte</td>
                <td>Duas vezes ao mês</td>
                <td>Quatro vezes ao mês</td>
                <td>Suporte ilimitado</td>
            </tr>

            <tfoot>
                <tr>
                    <td></td>
                    <td><button class="color-basic">Assinar</button></td>
                    <td><button class="color-standard">Assinar</button></td>
                    <td><button class="color-advanced">Assinar</button></td>
                </tr>
            </tfoot>
        </tbody>

    </table>
</body>
</html>
